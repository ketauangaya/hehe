<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confess</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-deep: #8b1a4a;
            --pink-mid: #c2185b;
            --pink-soft: #e91e7c;
            --pink-glow: #ff4d94;
            --pink-light: #ff8fbf;
            --bg-dark: #0d0a0e;
            --bg-card: rgba(30, 15, 25, 0.85);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: #f0e0ea;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============ HALAMAN INPUT NAMA ============ */
        #namePage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #namePage::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(194,24,91,0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }

        #namePage::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139,26,74,0.12) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            border-radius: 50%;
            pointer-events: none;
        }

        .name-container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
            animation: fadeUp 1s ease-out;
        }

        /* Judul dihapus sesuai request, styling disesuaikan */
        .name-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pink-light), var(--pink-mid), var(--pink-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .name-container p {
            font-size: 0.95rem;
            color: rgba(240,224,234,0.5);
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .input-group input {
            width: 320px;
            max-width: 85vw;
            padding: 14px 20px;
            background: rgba(30, 15, 25, 0.7);
            border: 1px solid rgba(194,24,91,0.3);
            border-radius: 12px;
            color: #f0e0ea;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(240,224,234,0.3);
        }

        .input-group input:focus {
            border-color: var(--pink-mid);
            box-shadow: 0 0 20px rgba(194,24,91,0.15);
        }

        .btn-enter {
            padding: 12px 48px;
            background: linear-gradient(135deg, var(--pink-mid), var(--pink-deep));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(194,24,91,0.35);
        }

        .btn-enter:active {
            transform: translateY(0);
        }

        /* ============ HALAMAN CONFESS (Amanda) ============ */
        #confessPage {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Latar belakang partikel hati kecil */
        .floating-hearts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-hearts span {
            position: absolute;
            display: block;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        .heart-svg {
            width: 12px;
            height: 12px;
            fill: var(--pink-mid);
            filter: blur(0.5px);
        }

        .confess-content {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.8s ease-out;
        }

        .heart-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem;
            animation: heartBeat 1.8s ease-in-out infinite;
        }

        .heart-icon svg {
            width: 100%;
            height: 100%;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.08); }
            60% { transform: scale(1); }
        }

        .confess-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--pink-light), var(--pink-soft), var(--pink-mid));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .btn-yes {
            padding: 12px 44px;
            background: linear-gradient(135deg, var(--pink-soft), var(--pink-mid));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            letter-spacing: 0.5px;
            position: relative;
        }

        .btn-yes:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 30px rgba(233,30,124,0.4);
        }

        .btn-no {
            padding: 12px 44px;
            background: rgba(30, 15, 25, 0.7);
            border: 1px solid rgba(194,24,91,0.3);
            border-radius: 50px;
            color: rgba(240,224,234,0.6);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: none;
            position: absolute;
            z-index: 10;
        }

        .btn-no-area {
            position: relative;
            width: 100%;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-yes-wrapper {
            position: relative;
            z-index: 5;
        }

        .answer-section {
            margin-top: 1rem;
            animation: fadeUp 0.5s ease-out;
        }

        .answer-section label {
            display: block;
            font-size: 0.85rem;
            color: rgba(240,224,234,0.5);
            font-weight: 300;
            margin-bottom: 0.6rem;
            letter-spacing: 0.3px;
        }

        .answer-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .answer-row input {
            width: 260px;
            max-width: 70vw;
            padding: 12px 18px;
            background: rgba(30, 15, 25, 0.7);
            border: 1px solid rgba(194,24,91,0.25);
            border-radius: 12px;
            color: #f0e0ea;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .answer-row input::placeholder {
            color: rgba(240,224,234,0.3);
        }

        .answer-row input:focus {
            border-color: var(--pink-mid);
            box-shadow: 0 0 20px rgba(194,24,91,0.15);
        }

        .btn-send {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--pink-mid), var(--pink-deep));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            letter-spacing: 0.3px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(194,24,91,0.3);
        }

        /* Toast notifikasi */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, var(--pink-mid), var(--pink-deep));
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 400;
            z-index: 9999;
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(139,26,74,0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ============ HALAMAN REJECT (Bukan Amanda) ============ */
        #rejectPage {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }

        .reject-content {
            text-align: center;
            padding: 2rem;
            animation: fadeUp 0.6s ease-out;
        }

        .reject-content .reject-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: rgba(240,224,234,0.7);
            margin-bottom: 0.5rem;
        }

        /* ============ HALAMAN SUKSES ============ */
        #successPage {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .success-content {
            text-align: center;
            padding: 2rem;
            animation: fadeUp 0.8s ease-out;
        }

        .success-heart {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            animation: heartBeat 1.2s ease-in-out infinite;
        }

        .success-heart svg {
            width: 100%;
            height: 100%;
        }

        .success-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pink-light), var(--pink-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .success-content p {
            font-size: 0.95rem;
            color: rgba(240,224,234,0.5);
            font-weight: 300;
        }

        /* ============ ANIMASI UMUM ============ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(194,24,91,0.06) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .hidden-form {
            display: none;
        }

        @media (max-width: 480px) {
            .name-container h1 { font-size: 1.8rem; }
            .confess-text { font-size: 1.35rem; }
            .input-group input { width: 280px; }
            .answer-row input { width: 220px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- ===== HALAMAN 1: INPUT NAMA (Tanpa Judul Confess) ===== -->
    <section id="namePage">
        <div class="name-container">
            <!-- Judul dihapus sesuai request -->
            <p>Siapa namamu?</p>
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Nama lengkap..." autocomplete="off" spellcheck="false">
                <button class="btn-enter" id="btnEnter">Lanjut</button>
            </div>
        </div>
    </section>

    <!-- ===== HALAMAN 2: CONFESS (untuk Amanda) ===== -->
    <section id="confessPage">
        <div class="floating-hearts" id="floatingHearts"></div>
        <div class="confess-content">
            <div class="heart-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff8fbf"/>
                            <stop offset="50%" style="stop-color:#e91e7c"/>
                            <stop offset="100%" style="stop-color:#8b1a4a"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
                             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" 
                          fill="url(#heartGrad)"/>
                </svg>
            </div>

            <div class="confess-text">hi aku naksir, mw jadi pacarku ga?</div>

            <div class="btn-group">
                <div class="btn-yes-wrapper">
                    <button class="btn-yes" id="btnYes">Iya</button>
                </div>
                <div class="btn-no-area" id="btnNoArea">
                    <button class="btn-no" id="btnNo">Engga</button>
                </div>
            </div>

            <div class="answer-section">
                <label>atau tulis jawabanmu sendiri</label>
                <div class="answer-row">
                    <input type="text" id="customAnswer" placeholder="Ketik di sini..." autocomplete="off" spellcheck="false">
                    <button class="btn-send" id="btnSend">Kirim</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== HALAMAN 3: REJECT (bukan Amanda) ===== -->
    <section id="rejectPage">
        <div class="reject-content">
            <!-- Subtitle "kamu bukan orang yang dimaksud" dihapus sesuai request -->
            <div class="reject-text">apasih wibu bergaul sana hama</div>
        </div>
    </section>

    <!-- ===== HALAMAN 4: SUKSES TERKIRIM ===== -->
    <section id="successPage">
        <div class="success-content">
            <div class="success-heart">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff8fbf"/>
                            <stop offset="50%" style="stop-color:#e91e7c"/>
                            <stop offset="100%" style="stop-color:#8b1a4a"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
                             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" 
                          fill="url(#heartGrad2)"/>
                </svg>
            </div>
            <h2>Terima kasih</h2>
            <p>Jawabanmu sudah terkirim</p>
        </div>
    </section>

    <!-- Form tersembunyi untuk FormSubmit -->
    <form class="hidden-form" id="submitForm" action="https://formsubmit.co/xf4isalhere@gmail.com" method="POST">
        <input type="hidden" name="nama" id="formName">
        <input type="hidden" name="jawaban" id="formAnswer">
        <input type="hidden" name="_subject" value="Confess - Jawaban Baru!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
    </form>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ DETEKSI NAMA AMANDA ============
        function isAmanda(name) {
            const n = name.trim().toLowerCase().replace(/\s+/g, ' ');

            // Daftar variasi yang dikenali
            const matches = [
                'amanda febriana',
                'manda febriana',
                'amanda febrina',
                'manda febrina',
                'amanda',
                'manda'
            ];

            // Cek exact match setelah normalisasi
            for (const m of matches) {
                if (n === m) return true;
            }

            // Cek apakah mengandung "amanda" atau "manda" sebagai kata utama
            const hasAmanda = n.includes('amanda') || n.includes('manda');
            const hasFeb = n.includes('febriana') || n.includes('febrina') || n.includes('febrian') || n.includes('febrin');

            if (hasAmanda) return true;

            return false;
        }

        // ============ NAVIGASI HALAMAN ============
        const namePage = document.getElementById('namePage');
        const confessPage = document.getElementById('confessPage');
        const rejectPage = document.getElementById('rejectPage');
        const successPage = document.getElementById('successPage');

        function showPage(page) {
            [namePage, confessPage, rejectPage, successPage].forEach(p => {
                p.style.display = 'none';
            });
            page.style.display = 'flex';
        }

        // ============ EVENT: TOMBOL LANJUT ============
        const nameInput = document.getElementById('nameInput');
        const btnEnter = document.getElementById('btnEnter');
        let guestName = '';

        btnEnter.addEventListener('click', processName);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') processName();
        });

        function processName() {
            guestName = nameInput.value.trim();
            if (!guestName) {
                showToast('Masukkan nama dulu');
                return;
            }

            if (isAmanda(guestName)) {
                showPage(confessPage);
                createFloatingHearts();
            } else {
                showPage(rejectPage);
            }
        }

        // ============ TOMBOL "IYA" ============
        document.getElementById('btnYes').addEventListener('click', () => {
            submitAnswer('Iya');
        });

        // ============ TOMBOL "ENGGA" YANG KABUR ============
        const btnNo = document.getElementById('btnNo');
        const btnNoArea = document.getElementById('btnNoArea');

        let noBtnPlaced = false;

        function placeNoBtnCenter() {
            const areaRect = btnNoArea.getBoundingClientRect();
            btnNo.style.position = 'absolute';
            btnNo.style.left = (areaRect.width / 2 - btnNo.offsetWidth / 2) + 'px';
            btnNo.style.top = (areaRect.height / 2 - btnNo.offsetHeight / 2) + 'px';
            noBtnPlaced = true;
        }

        btnNo.addEventListener('mouseenter', () => {
            if (!noBtnPlaced) placeNoBtnCenter();
            moveNoButton();
        });

        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!noBtnPlaced) placeNoBtnCenter();
            moveNoButton();
        });

        function moveNoButton() {
            const areaRect = btnNoArea.getBoundingClientRect();
            const btnW = btnNo.offsetWidth;
            const btnH = btnNo.offsetHeight;

            const maxLeft = areaRect.width - btnW;
            const maxTop = Math.max(80, areaRect.height) - btnH;

            let newLeft, newTop;
            let attempts = 0;

            do {
                newLeft = Math.random() * Math.max(0, maxLeft);
                newTop = Math.random() * Math.max(0, maxTop);
                attempts++;
            } while (attempts < 20 && isTooClose(newLeft, newTop));

            btnNo.style.left = newLeft + 'px';
            btnNo.style.top = newTop + 'px';
        }

        function isTooClose(newL, newT) {
            const currL = parseFloat(btnNo.style.left) || 0;
            const currT = parseFloat(btnNo.style.top) || 0;
            const dist = Math.sqrt((newL - currL) ** 2 + (newT - currT) ** 2);
            return dist < 80;
        }

        // ============ KIRIM JAWABAN CUSTOM ============
        document.getElementById('btnSend').addEventListener('click', () => {
            const answer = document.getElementById('customAnswer').value.trim();
            if (!answer) {
                showToast('Tulis jawaban dulu');
                return;
            }
            submitAnswer(answer);
        });

        // ============ SUBMIT KE FORMSUBMIT ============
        function submitAnswer(answer) {
            document.getElementById('formName').value = guestName;
            document.getElementById('formAnswer').value = answer;

            const form = document.getElementById('submitForm');
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    showPage(successPage);
                } else {
                    form.submit();
                }
            })
            .catch(() => {
                form.submit();
            });
        }

        // ============ PARTIKEL HATI MENGAMBANG ============
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            container.innerHTML = '';

            const heartSVG = `<svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

            for (let i = 0; i < 20; i++) {
                const span = document.createElement('span');
                span.innerHTML = heartSVG;
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (8 + Math.random() * 12) + 's';
                span.style.animationDelay = (Math.random() * 10) + 's';

                const size = 8 + Math.random() * 14;
                span.querySelector('svg').style.width = size + 'px';
                span.querySelector('svg').style.height = size + 'px';
                span.querySelector('svg').style.fill = 
                    `hsl(${330 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${30 + Math.random() * 30}%)`;

                container.appendChild(span);
            }
        }

        // ============ TOAST ============
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        nameInput.focus();
    </script>
</body>
</html>
